[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "vlm-lab"
version = "0.1.0"
description = "Reproducible benchmark platform for lightweight vision-language image captioning models"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = {text = "MIT"}
authors = [{name = "Projet IA Générative Visuelle"}]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "pydantic-settings>=2.6,<3",
  "python-multipart>=0.0.12,<1",
  "pillow>=10.4,<13",
]

[project.optional-dependencies]
ml = [
  "torch>=2.2,<3",
  "transformers>=4.46,<5",
  "accelerate>=1.1,<2",
  "bitsandbytes>=0.44,<1; platform_system != 'Darwin'",
  "sacrebleu>=2.4,<3",
  "rouge-score>=0.1.2,<1",
  "psutil>=6,<8",
]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.8,<1",
  "mypy>=1.13,<3",
]
data = ["kagglehub>=0.3,<1", "pandas>=2.2,<3"]

[project.scripts]
vlm-lab = "vlm_lab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vlm_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-warnings --maxfail=1"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["vlm_lab"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
  "psutil",
  "torch",
  "torch.*",
  "transformers",
  "transformers.*",
  "sacrebleu",
  "rouge_score",
  "rouge_score.*",
]
ignore_missing_imports = true
follow_imports = "skip"

